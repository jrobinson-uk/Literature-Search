<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 15px; background: #f4f7f6; }
      .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
      input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
      button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
      .btn-start { background: #1a73e8; color: white; }
      .btn-next { background: #34a853; color: white; }
      #status { font-size: 12px; color: #666; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="card">
      <label><b>Step 1: Start Snowball</b></label>
      <input type="text" id="seedInput" placeholder="Enter DOI or Title">
      <button class="btn-start" onclick="start()">Initialize from Seed</button>
    </div>

    <div class="card">
      <label><b>Step 2: Expand</b></label>
      <p style="font-size: 11px;">Select papers in the 'Include' column of your sheet first.</p>
      <button class="btn-next" onclick="expand()">Fetch Next Level Citations</button>
    </div>

    <div id="status">Ready...</div>

    <script>
      function start() {
        const input = document.getElementById('seedInput').value;
        updateStatus("Searching OpenAlex...");
        google.script.run
          .withSuccessHandler(s => updateStatus(s))
          .startSnowball(input);
      }

      function expand() {
        updateStatus("Expanding graph... this may take a moment.");
        google.script.run
          .withSuccessHandler(s => updateStatus(s))
          .expandSnowball();
      }

      function updateStatus(msg) {
        document.getElementById('status').innerText = msg;
      }
    </script>
  </body>
</html>
